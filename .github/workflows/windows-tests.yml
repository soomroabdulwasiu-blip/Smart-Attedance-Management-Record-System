name: Windows application verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint and format new service boundaries
        run: >-
          python -m ruff check amrs/cameras.py amrs/hardware_ui.py amrs/academic.py amrs/devices.py amrs/privacy.py amrs/secure_store.py amrs/config.py amrs/configuration.py amrs/configuration_ui.py amrs/diagnostics.py amrs/paths.py amrs/maintenance.py amrs/operations_ui.py amrs/presentation_data.py amrs/ui_reads.py amrs/migrations tools
      - name: Types in service boundaries
        run: >-
          python -m mypy amrs/cameras.py amrs/hardware_ui.py amrs/academic.py amrs/devices.py amrs/privacy.py amrs/secure_store.py amrs/config.py amrs/configuration.py amrs/configuration_ui.py amrs/diagnostics.py amrs/paths.py amrs/maintenance.py amrs/operations_ui.py amrs/presentation_data.py amrs/ui_reads.py amrs/migrations tools --ignore-missing-imports --follow-imports=silent --check-untyped-defs
      - name: Unit and Qt tests; camera-boundary coverage gate
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -m "not legacy" --cov=amrs.cameras --cov=amrs.hardware_ui --cov-fail-under=80 --cov-report=xml:artifacts/unit-coverage.xml -q
      - name: Known-vulnerability gate
        run: python -m pip_audit -r requirements.lock.txt --disable-pip --no-deps
      - name: Static security report (high severity gate)
        run: python -m bandit -r amrs -lll -f json -o artifacts/bandit-high.json

  native-oracle:
    # Explicit operator dispatch on an isolated, DBA-authorized test runner only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, AMRS-Oracle-Test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Disposable native schemas, collected legacy scenarios, full coverage gate
        env:
          AMRS_ALLOW_NATIVE_ISOLATED_TEST: '1'
        run: python -m tools.native_oracle_check
